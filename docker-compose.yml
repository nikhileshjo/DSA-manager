services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sql-manager-app
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/sql_manager.db
    volumes:
      - sql_data:/app/data
    restart: unless-stopped

volumes:
  sql_data:
    driver: local
