services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dsa-manager-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/dsa_manager.db
    volumes:
      - dsa_data:/app/data
    restart: unless-stopped

volumes:
  dsa_data:
    driver: local
