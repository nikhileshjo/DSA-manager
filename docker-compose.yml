services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-manager-app
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/spark_manager.db
    volumes:
      - spark_data:/app/data
    restart: unless-stopped

volumes:
  spark_data:
    driver: local
